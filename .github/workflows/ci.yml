name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install stim==1.16.0 pymatching==2.4.0 sinter==1.16.0 numpy scipy matplotlib pytest onnx onnxruntime
      - name: Python tests (data generation, evaluation, metrics, validation against published values)
        run: python -m pytest tests -q
      - name: JavaScript tests (browser decoders against PyMatching and PyTorch)
        run: node tests_js/test_qec.js
